# PPOTrainingConfig - PPO (Proximal Policy Optimization) 训练配置
# 基于 verl 框架的 PPO 配置
# 参考: https://github.com/verl/verl

### 基础模型配置
model_name_or_path: "Qwen/Qwen3-4B"
max_seq_length: 2048
use_gradient_checkpointing: true
device_map: "auto"

### 量化配置
use_4bit: false
use_8bit: false
use_fp16: false
use_bf16: false
trust_remote_code: true

### 输出配置
output_dir: "output/ppo"
num_train_epochs: 3
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 1
learning_rate: 2e-5
logging_steps: 10
save_steps: 500
save_total_limit: 2
warmup_ratio: 0.03
lr_scheduler_type: "cosine"
report_to: "none"
eval_strategy: "steps"
eval_steps: 50
load_best_model_at_end: false
metric_for_best_model: "eval_loss"
greater_is_better: false
max_grad_norm: 1.0
dataloader_pin_memory: false
remove_unused_columns: false
do_train: true
do_eval: false
dataloader_num_workers: 4

### PPO/verl 配置
stage: "ppo"

### 数据配置
data:
  tokenizer: null
  train_files: "data/rlhf/train.parquet"
  val_files: "data/rlhf/val.parquet"
  prompt_key: "prompt"
  max_prompt_length: 512
  max_response_length: 512
  train_batch_size: 1024
  val_batch_size: null
  return_raw_input_ids: false
  return_raw_chat: false
  return_full_prompt: false
  shuffle: true
  dataloader_num_workers: 8
  validation_shuffle: false
  filter_overlong_prompts: false
  truncation: "error"

### Actor-Rollout-Ref 配置
actor_rollout_ref:
  hybrid_engine: true
  model:
    path: "Qwen/Qwen3-4B"
    custom_chat_template: null
    use_shm: false
    external_lib: null
    override_config: {}
    enable_gradient_checkpointing: true
    enable_activation_offload: false
    use_remove_padding: false
    lora_rank: 0
    lora_alpha: 16
    target_modules: "all-linear"
    exclude_modules: null
    use_liger: false
    use_fused_kernels: false
    trust_remote_code: false

  actor:
    strategy: "fsdp"
    ppo_mini_batch_size: 256
    ppo_micro_batch_size_per_gpu: null
    use_dynamic_bsz: false
    ppo_max_token_len_per_gpu: 16384
    grad_clip: 1.0
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    entropy_coeff: 0.0
    use_kl_loss: false
    use_torch_compile: true
    kl_loss_coef: 0.001
    kl_loss_type: "low_var_kl"
    ppo_epochs: 1
    shuffle: false
    ulysses_sequence_parallel_size: 1
    entropy_from_logits_with_chunking: false
    entropy_checkpointing: false
    optim:
      lr: 1e-6
      lr_warmup_steps: -1
      lr_warmup_steps_ratio: 0.0
      min_lr_ratio: 0.0
      warmup_style: "constant"
      total_training_steps: -1
      weight_decay: 0.01
    fsdp_config:
      wrap_policy:
        min_num_params: 0
      param_offload: false
      optimizer_offload: false
      offload_policy: false
      reshard_after_forward: true
      fsdp_size: -1

  ref:
    strategy: "fsdp"
    fsdp_config:
      param_offload: false
      reshard_after_forward: true
      wrap_policy:
        min_num_params: 0
    use_torch_compile: false
    log_prob_micro_batch_size_per_gpu: null
    log_prob_use_dynamic_bsz: false
    log_prob_max_token_len_per_gpu: 16384
    ulysses_sequence_parallel_size: 1

  rollout:
    name: "vllm"
    mode: "sync"
    temperature: 1.0
    top_k: -1
    top_p: 1.0
    prompt_length: 512
    response_length: 512
    dtype: "bfloat16"
    gpu_memory_utilization: 0.5
    ignore_eos: false
    enforce_eager: true
    free_cache_engine: true
    load_format: "dummy_dtensor"
    layered_summon: false
    tensor_model_parallel_size: 2
    max_num_batched_tokens: 8192
    max_model_len: null
    max_num_seqs: 1024
    log_prob_micro_batch_size_per_gpu: null
    log_prob_use_dynamic_bsz: false
    log_prob_max_token_len_per_gpu: 16384
    disable_log_stats: true
    enable_chunked_prefill: true
    do_sample: true
    n: 1
    multi_stage_wake_up: false
    engine_kwargs:
      vllm:
        swap_space: null
        disable_mm_preprocessor_cache: false
      sglang:
        attention_backend: null
    val_kwargs:
      top_k: -1
      top_p: 1.0
      temperature: 0
      n: 1
      do_sample: false
    multi_turn:
      enable: false
      max_assistant_turns: null
      tool_config_path: null
      max_user_turns: null
      max_parallel_calls: 1
      max_tool_response_length: 256
      tool_response_truncate_side: "middle"
      interaction_config_path: null
      completion_callback: null
      use_inference_chat_template: false
      tokenization_sanity_check_mode: "strict"
      format: "hermes"
    calculate_log_probs: false

### Critic 配置
critic:
  strategy: "fsdp"
  rollout_n: 1
  optim:
    lr: 1e-5
    lr_warmup_steps_ratio: 0.0
    min_lr_ratio: null
    warmup_style: "constant"
    total_training_steps: -1
    weight_decay: 0.01
  model:
    path: "Qwen/Qwen3-4B"
    tokenizer_path: "Qwen/Qwen3-4B"
    use_shm: false
    override_config: {}
    external_lib: null
    enable_gradient_checkpointing: true
    enable_activation_offload: false
    use_remove_padding: false
    trust_remote_code: false
    fsdp_config:
      param_offload: false
      optimizer_offload: false
      offload_policy: false
      reshard_after_forward: true
      wrap_policy:
        min_num_params: 0
      fsdp_size: -1
    lora_rank: 0
    lora_alpha: 16
    target_modules: "all-linear"
  ppo_mini_batch_size: 256
  ppo_micro_batch_size_per_gpu: null
  forward_micro_batch_size: null
  forward_micro_batch_size_per_gpu: null
  use_dynamic_bsz: false
  ppo_max_token_len_per_gpu: 32768
  forward_max_token_len_per_gpu: 32768
  ulysses_sequence_parallel_size: 1
  ppo_epochs: 1
  shuffle: false
  grad_clip: 1.0
  cliprange_value: 0.5
  loss_agg_mode: "token-mean"

### Reward Model 配置
reward_model:
  enable: false
  strategy: "fsdp"
  model:
    input_tokenizer: "Qwen/Qwen3-4B"
    path: "your_reward_model_path"
    use_shm: false
    external_lib: null
    use_remove_padding: false
    use_fused_kernels: false
    trust_remote_code: false
    fsdp_config:
      wrap_policy:
        min_num_params: 0
      param_offload: false
      reshard_after_forward: true
      fsdp_size: -1
  micro_batch_size_per_gpu: null
  max_length: null
  ulysses_sequence_parallel_size: 1
  use_dynamic_bsz: false
  forward_max_token_len_per_gpu: 32768
  reward_manager: "naive"
  launch_reward_fn_async: false
  sandbox_fusion:
    url: null
    max_concurrent: 64
    memory_limit_mb: 1024

### 算法配置
algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: "gae"
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  kl_penalty: "kl"
  kl_ctrl:
    type: "fixed"
    kl_coef: 0.001
    horizon: 10000
    target_kl: 0.1
  use_pf_ppo: false

### Trainer 配置
trainer:
  balance_batch: true
  total_epochs: 30
  total_training_steps: null
  profile_steps: null
  project_name: "verl_ppo"
  experiment_name: "ppo_experiment"
  logger: ["console"]
  log_val_generations: 0
  rollout_data_dir: null
  validation_data_dir: null
  nnodes: 1
  n_gpus_per_node: 8
  save_freq: -1
  resume_mode: "auto"
  resume_from_path: null
  val_before_train: true
  val_only: false
  test_freq: -1
  critic_warmup: 0
  default_hdfs_dir: null
  del_local_ckpt_after_load: false
  default_local_dir: "checkpoints/${trainer.project_name}/${trainer.experiment_name}"
  max_actor_ckpt_to_keep: null
  max_critic_ckpt_to_keep: null
  ray_wait_register_center_timeout: 300
  device: "cuda"

### Ray 初始化配置
ray_init:
  num_cpus: null
  timeline_json_file: null

### 分布式训练配置
distributed_strategy: "auto"
find_unused_parameters: false
main_process_ip: "localhost"
main_process_port: 29500
num_machines: 1
machine_rank: 0
