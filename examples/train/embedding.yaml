# EmbeddingTrainingConfig - 嵌入模型训练配置
# 用于训练 embedding 模型进行向量检索

### 基础模型配置
model_name_or_path: "Qwen/Qwen3-4B"
max_seq_length: 2048
use_gradient_checkpointing: true
device_map: "auto"

### 量化配置
use_4bit: false
use_8bit: false
use_fp16: false
use_bf16: false
trust_remote_code: true

### 输出配置
output_dir: "output/embedding"
num_train_epochs: 3
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 1
learning_rate: 2e-5
logging_steps: 10
save_steps: 500
save_total_limit: 2
warmup_ratio: 0.03
lr_scheduler_type: "cosine"
report_to: "none"
eval_strategy: "steps"
eval_steps: 50
load_best_model_at_end: false
metric_for_best_model: "eval_loss"
greater_is_better: false
max_grad_norm: 1.0
dataloader_pin_memory: false
remove_unused_columns: false
do_train: true
do_eval: false
dataloader_num_workers: 4

### Embedding 特定配置
stage: "embedding"
finetuning_type: "lora"

# 损失函数配置
loss_type: "softmax"  # softmax, cosine, contrastive, info_nce, mnr
normalized: true  # 是否对 embedding 进行 L2 归一化
temperature: 0.02  # 温度参数
num_classes: null  # 类别数（仅用于 softmax 损失）
embedding_dim: 768  # embedding 维度
margin: 0.3  # 对比损失边界值

### LoRA 配置
lora_rank: 16
lora_alpha: 16
lora_dropout: 0.05
lora_bias: "none"
lora_task_type: "FEATURE_EXTRACTION"
target_modules: null

### 数据配置
dataset: "your_embedding_dataset_name"
dataset_dir: "data"
template: "qwen2"
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 8

### 验证配置
val_size: 0.0

### 分布式训练配置
distributed_strategy: "auto"
find_unused_parameters: false
main_process_ip: "localhost"
main_process_port: 29500
num_machines: 1
machine_rank: 0
