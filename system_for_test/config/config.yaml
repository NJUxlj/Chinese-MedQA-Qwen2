
# LLM配置
llm:
  provider: "qwen2"  # 可选: "qwen2" 或 "zhipu"
  qwen:
    model_name: "Qwen/Qwen2-7B-Instruct"
    api_key: "${QWEN_API_KEY}"
  zhipu:
    model_name: "glm-4"
    api_key: "${ZHIPU_API_KEY}"

# 向量数据库配置
vector_store:
  provider: "chroma"  # 可选: "chroma", "faiss", "milvus"
  embedding_model: "BAAI/bge-large-zh-v1.5"
  collection_name: "medical_knowledge"
  persist_directory: "./data/vector_db"

# PubMed配置
pubmed:
  email: "your-email@example.com"  # NCBI要求提供邮箱
  api_key: "${PUBMED_API_KEY}"  # 可选，如有API密钥可提高请求限制
  tool_name: "MedicalAIAgent"  # 用于标识您的应用程序
  max_results: 10  # 每次查询最大返回结果数
  
# 本地知识库配置
local_knowledge:
  directories:
    - "./data/local_knowledge/papers"
    - "./data/local_knowledge/guidelines"
  file_types:
    - ".pdf"
    - ".txt"
    - ".csv"

# Agent配置
agent:
  max_reflection_rounds: 2  # 最大反思轮次
  reflection_strategy: "cot"  # 可选: "cot" (Chain of Thought), "react" (Reasoning and Acting)
  temperature: 0.1  # LLM推理温度
