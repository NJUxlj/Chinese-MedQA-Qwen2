# =============================================================================
# Chinese-MedQA-Qwen2 统一配置文件
#
# 全项目所有配置项一律集中在本文件，由 src/config/settings.py 加载。
# 不再使用 .env / python-dotenv / 任何 os.environ 注入。
# 所有需要修改的参数（密钥、路径、端点等）请直接编辑本文件。
# =============================================================================

# =============================================================================
# LLM 配置（默认对接智谱 GLM-4.6 接口，按需修改）
# =============================================================================
llm:
  model_provider: openai
  model_path: "/Users/xiniuyiliao/Desktop/code/models/Qwen3-0.6B"
  model_name: MiniMax-M2.7
  api_key: "sk-cp-oEWm76En3Nne3Jz7CsDBtEPZjb4R59ygrKzbDXkge5vV-fuIUBpM1_AgkGZuDcbzIFHpgYA0Vv_FwxC0ueri7UX1Ibl7uOlJmFcH4X23YloJ3OohY2lAO9o"
  base_url: https://api.minimaxi.com/v1
  max_tokens: 2048
  temperature: 0.7
  top_p: 0.9
  timeout: 60
  streaming: false
  max_workers: 10

# =============================================================================
# Milvus 配置
# =============================================================================
milvus:
  uri: http://localhost:19530
  token: ""
  db_name: default
  index_type: FLAT
  metric_type: L2
  consistency_level: Strong
  collection_names: [web_crawled_texts, text_books, guidelines]

# =============================================================================
# Neo4j 配置
# =============================================================================
neo4j:
  uri: bolt://localhost:7687
  username: neo4j
  password: ""

# =============================================================================
# RAG 配置
# =============================================================================
rag:
  retriever_type: hybrid
  embedding_model_name: Qwen3-Embedder-0.6B
  top_k: 5
  similarity_threshold: 0.5
  use_reranker: true
  hybrid_weight: 0.7

# =============================================================================
# Agent 配置（Agent 模块统一从此节读取 LLM 调用参数）
# =============================================================================
agent:
  max_iterations: 10
  tool_timeout: 30
  enable_auto_tool_choice: false
  model_name: MiniMax-M2.7
  api_key: "sk-cp-oEWm76En3Nne3Jz7CsDBtEPZjb4R59ygrKzbDXkge5vV-fuIUBpM1_AgkGZuDcbzIFHpgYA0Vv_FwxC0ueri7UX1Ibl7uOlJmFcH4X23YloJ3OohY2lAO9o"
  base_url: https://api.minimaxi.com/v1
  max_tokens: 2048
  temperature: 0.7
  timeout: 60
  streaming: false

# =============================================================================
# 嵌入配置（核心库使用）
# =============================================================================
embedding:
  model_provider: sentence_transformers
  model_name: Qwen3-Embedder-0.6B
  model_path: "/Users/xiniuyiliao/Desktop/code/models/Qwen3-Embedder-0.6B"
  device: cpu
  base_url: ""
  api_key: ""
  batch_size: 32
  dimension: 768


reranker:
  model_provider: sentence_transformers  # sentence_transformers / transformers / vllm
  model_path: "/Users/xiniuyiliao/Desktop/code/models/Qwen3-0.6B"  # 本地模型路径，为空则不使用 reranker
  model_name: ""  # 模型名称（vLLM 部署时使用）
  device: cpu  # cuda / cpu
  use_reranker: false
  base_url: ""   # vLLM API 地址，如 http://localhost:8000
  api_key: ""    # API 密钥（如 vLLM 未启用认证可留空）

# =============================================================================
# VLLM 部署配置
# =============================================================================
vllm:
  model_name_or_path: /Users/xiniuyiliao/Desktop/code/models/Qwen3-0.6B
  host: 0.0.0.0
  port: 8000
  base_url: http://localhost:8000
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  gpu_memory_utilization: 0.9
  max_model_len: null
  max_num_seqs: null
  dtype: auto
  quantization: null
  enforce_eager: false
  swap_space: 4
  trust_remote_code: true
  seed: 42
  streaming: false

# =============================================================================
# API 服务（FastAPI 主入口）配置
# 取代原先散落在 src/api/main.py / routers/admin.py 的环境变量。
# =============================================================================
api_server:
  host: 0.0.0.0
  port: 8000
  base_url: http://localhost:8000
  preload_models: true
  cors_allowed_origins:
    - http://localhost:3000
    - http://localhost:8000
  admin_api_key: ""

# =============================================================================
# RAG 服务配置（src/api/services/rag_service.py）
# default_kb 留空表示不预加载默认知识库
# =============================================================================
rag_service:
  kb_index_dir: knowledge_base/indices
  default_retriever: hybrid
  default_kb: ""

# =============================================================================
# PubMed API 配置
# =============================================================================
pubmed:
  api_key: ""
  email: ""
  tool_name: MedicalAIAgent
  max_results: 10

# =============================================================================
# Knowledge Base 配置
# =============================================================================
knowledge_base:
  index_dir: knowledge_base/indices
  default_retriever: hybrid

# =============================================================================
# Retriever 配置
# =============================================================================
retriever:
  default_type: hybrid
  default_weight: 0.7
  bm25_score_threshold: 0.1
  use_jieba: true
  knn_index_type: Flat
  knn_n_list: 100
  knn_m: 16
  l2_distance_threshold: 0.5

# =============================================================================
# NER 配置
# =============================================================================
ner:
  model_provider: spacy
  model_name: zh_core_web_sm
  device: -1
  batch_size: 32



# =============================================================================
# 训练配置 (参考 LLaMA-Factory)
# =============================================================================
training:
  output_dir: ./output
  sft_model_name: qwen2_medical_sft
  dpo_model_name: qwen2_medical_dpo
  deepspeed_config_path: ./src/config/ds_config.json

# Method
method:
  stage: sft
  do_train: true
  finetuning_type: lora
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0
  lora_target: all

# Data
data:
  dataset: alpaca_en_demo
  template: qwen
  flash_attn: auto
  cutoff_len: 1024
  max_samples: 1000
  preprocessing_num_workers: 16
  dataloader_num_workers: 4
  train_files: null
  val_files: null
  prompt_key: question
  response_key: answer

# Output
output:
  output_dir: ./output
  logging_steps: 10
  save_steps: 500
  plot_loss: true
  overwrite_output_dir: true
  report_to: tensorboard

# Train
train:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  num_train_epochs: 3.0
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  bf16: true
  ddp_timeout: 180000000
  max_grad_norm: 1.0
  optim: adamw_torch

# Eval
eval:
  val_size: 0.1
  per_device_eval_batch_size: 1
  eval_strategy: steps
  eval_steps: 500

# =============================================================================
# RL 训练配置 (参考 verl)
# =============================================================================
rl_data:
  train_files: ~/data/rlhf/gsm8k/train.parquet
  val_files: ~/data/rlhf/gsm8k/test.parquet
  prompt_key: prompt
  max_prompt_length: 512
  max_response_length: 512
  train_batch_size: 1024
  shuffle: true
  dataloader_num_workers: 8

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: /Users/xiniuyiliao/Desktop/code/models/gpt2
    enable_gradient_checkpointing: true
    lora_rank: 0
    lora_alpha: 16
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 256
    grad_clip: 1.0
    clip_ratio: 0.2
    lr: 1e-6
    weight_decay: 0.01
  rollout:
    name: vllm
    temperature: 1.0
    top_k: -1
    top_p: 1.0
    dtype: bfloat16
    gpu_memory_utilization: 0.5

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: gae
  kl_penalty: kl
  kl_ctrl:
    type: fixed
    kl_coef: 0.001

rl_trainer:
  total_epochs: 30
  project_name: verl_examples
  experiment_name: gsm8k
  logger: [console, wandb]
  nnodes: 1
  n_gpus_per_node: 8
  save_freq: -1
  test_freq: -1
  device: cuda

ray_init:
  num_cpus: null
